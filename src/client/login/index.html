<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:," />
    <title>Sign in</title>
    <script type="module" src="./login.ts"></script>
  </head>
  <body>
    <main class="login">
      <div class="mark" aria-hidden="true"><span class="c"></span><span class="p"></span><span class="c"></span><span class="p"></span></div>
      <h1>Sign in</h1>
      <p class="sub">Private. Invitation only.</p>
      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required spellcheck="false" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p id="error" class="error" role="alert" aria-live="assertive"></p>
        <button class="btn primary" type="submit" id="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
